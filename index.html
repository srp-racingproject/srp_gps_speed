<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b15">
<meta name="application-name" content="SRP GPS SPEED">
<meta name="apple-mobile-web-app-title" content="SRP GPS SPEED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>SRP GPS SPEED</title>
<style>
:root{color-scheme:dark;--bg:#050b15;--panel:#081321;--line:#203b58;--blue:#087ff0;--cyan:#42d7ff;--muted:#8fa7c0;--white:#f2f7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);background:radial-gradient(ellipse at 90% 12%,#0b3154 0,transparent 43%),linear-gradient(145deg,#07111f,#030811 78%);overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:linear-gradient(45deg,#29445e 25%,transparent 25%,transparent 75%,#29445e 75%),linear-gradient(45deg,#29445e 25%,transparent 25%,transparent 75%,#29445e 75%);background-position:0 0,12px 12px;background-size:24px 24px}
.app{width:min(100%,780px);min-height:100svh;margin:auto;padding:max(12px,env(safe-area-inset-top)) clamp(14px,4vw,30px) max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(10px,1.8vh,16px);position:relative}
.header{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid #1b344d}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;font-style:italic;font-weight:1000;letter-spacing:-.8px;line-height:1;text-transform:uppercase}
.srp{font-size:clamp(24px,6.3vw,36px);color:#f4f7ff;text-shadow:0 1px 0 #8ca6c0,0 0 13px #168cff50}
.gps{font-size:clamp(15px,4.2vw,24px);letter-spacing:.2px;background:linear-gradient(100deg,#25d9ff,#168bff 65%,#eaf5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font-variant-numeric:tabular-nums;color:#a9c0d9;text-align:right;line-height:1.35;white-space:nowrap;flex:0 0 auto}
#time{font-weight:850;color:#f2f7ff;font-size:clamp(13px,3.4vw,17px);letter-spacing:.4px}#date{font-size:clamp(9px,2.4vw,12px);color:#8ca6c1}
.panel{flex:1;min-height:calc(100svh - 115px);border:1px solid #24405e;background:linear-gradient(145deg,rgba(11,24,41,.97),rgba(5,13,24,.98));border-radius:clamp(18px,4vw,28px);padding:clamp(14px,3.2vw,26px);box-shadow:0 12px 35px #0002;display:flex;flex-direction:column}
.speedbox{flex:1;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 0 28px}
.speedlabel{color:#8ca6c1;font-weight:900;font-size:clamp(10px,2.5vw,13px);letter-spacing:clamp(3px,.8vw,5px)}
.speed{font-size:clamp(76px,21vw,132px);font-weight:950;letter-spacing:-.065em;line-height:1.12;font-variant-numeric:tabular-nums;text-shadow:0 0 32px #168cff25;white-space:nowrap}
.speed em{font-size:clamp(15px,4vw,22px);font-style:normal;letter-spacing:1px;color:#59ceff;margin-left:7px}
.status{font-size:clamp(10px,2.6vw,14px);color:#7f9ab6;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.status i{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#f4b74c}.status.live i{background:#31e69c;box-shadow:0 0 10px #31e69c}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.7vw,12px);flex:0 0 auto}
.stat{border:1px solid #203a56;border-radius:clamp(13px,2.5vw,19px);padding:clamp(10px,2.3vw,17px);background:#07111e;min-width:0}
.stat label{display:block;color:#8ca6c1;font-size:clamp(10px,2.5vw,14px);line-height:1.35;margin-bottom:7px}
.stat b{font-size:clamp(20px,5vw,31px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:clamp(10px,2.5vw,14px);color:#5bcfff;margin-left:4px}
.actions{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;flex:0 0 auto;margin-top:clamp(12px,2vh,18px)}
button{border:0;border-radius:clamp(13px,2.5vw,18px);padding:clamp(15px,2.8vh,23px) 8px;font-size:clamp(13px,3.5vw,19px);font-weight:900;color:white;cursor:pointer;touch-action:manipulation;white-space:nowrap}
#start{background:linear-gradient(110deg,#0876df,#168fff);box-shadow:0 7px 20px #007bff2c}#reset{background:#0a1727;border:1px solid #2a4562;color:#b7cbe0}button:active{transform:scale(.985)}
.note{flex:0 0 auto;font-size:clamp(9px,2.3vw,12px);color:#7089a4;line-height:1.45;margin:clamp(9px,1.5vh,13px) 2px 0}
.footer{text-align:center;color:#526d89;font-size:clamp(9px,2.1vw,12px);letter-spacing:clamp(1px,.4vw,2px);padding-bottom:2px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat b{font-size:clamp(17px,2.7vw,24px)}}
@media(max-height:700px){.app{gap:7px;padding-top:max(7px,env(safe-area-inset-top))}.header{min-height:40px;padding-bottom:6px}.panel{min-height:0}.speedbox{min-height:160px;padding:8px 0 14px}.speed{font-size:clamp(60px,15vw,88px)}.stat{padding:8px}.stat label{margin-bottom:3px}.actions{margin-top:8px}button{padding:12px 6px}.note{margin-top:7px}.footer{display:none}}
@media(display-mode:standalone){body{user-select:none}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand" aria-label="SRP GPS SPEED"><span class="srp">SRP</span><span class="gps">GPS SPEED</span></div><div class="clock"><div id="time">--:--:--</div><div id="date">กำลังโหลดวันที่</div></div></header>
<section class="panel">
<div class="speedbox"><div class="speedlabel">CURRENT SPEED</div><div class="speed"><span id="speed">0.0</span><em>km/h</em></div><div class="status" id="status"><i></i><span>พร้อมเริ่มวัดความเร็ว</span></div></div>
<div class="stats">
<div class="stat"><label>ระยะทางรวม · DISTANCE</label><b id="distance">0.00</b><span>km</span></div>
<div class="stat"><label>ความเร็วสูงสุด · MAX</label><b id="max">0.0</b><span>km/h</span></div>
<div class="stat"><label>ความเร็วเฉลี่ย · AVG</label><b id="avg">0.0</b><span>km/h</span></div>
<div class="stat"><label>เวลาเดินทาง · TIME</label><b id="elapsed">00:00</b></div>
</div>
<div class="actions"><button id="start">▶ &nbsp; เริ่มวัดความเร็ว</button><button id="reset">↻ &nbsp; รีเซ็ต</button></div>
<p class="note">เปิด Location และอนุญาตตำแหน่ง GPS · ต้องเปิดผ่าน HTTPS และแนะนำให้เปิดแอปค้างไว้ขณะวัด</p>
</section>
<div class="footer">SRP • GPS SPEED • RIDE WITH DATA</div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const MAX_ACC=40,MIN_KMH=2,STALE_MS=5000;
let watching=null,running=false,startedAt=0,elapsedBefore=0,lastPos=null,distanceM=0,maxSpeed=0,speedNow=0,lastFixAt=0,tick=null,wake=null;
const p2=n=>String(n).padStart(2,'0');
const fmtTime=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?`${p2(h)}:${p2(m)}:${p2(sec)}`:`${p2(m)}:${p2(sec)}`};
function updateClock(){const d=new Date();$('time').textContent=d.toLocaleTimeString('th-TH',{hour12:false});$('date').textContent=d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});}
function setStatus(text,live=false){$('status').classList.toggle('live',live);$('status').querySelector('span').textContent=text;}
function elapsed(){return elapsedBefore+(running?(Date.now()-startedAt)/1000:0);}
function render(){if(running&&lastFixAt&&Date.now()-lastFixAt>STALE_MS){speedNow=0;setStatus('รอสัญญาณ GPS…');} $('speed').textContent=speedNow.toFixed(1);$('distance').textContent=(distanceM/1000).toFixed(2);$('max').textContent=maxSpeed.toFixed(1);const e=elapsed();$('avg').textContent=(e>0?(distanceM/1000)/(e/3600):0).toFixed(1);$('elapsed').textContent=fmtTime(e);}
function haversine(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
async function lockScreen(){try{if('wakeLock'in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}
function unlockScreen(){try{if(wake)wake.release();}catch(e){}wake=null;}
function onFix(pos){if(!running)return;const c=pos.coords,acc=Number.isFinite(c.accuracy)?c.accuracy:999,now={lat:c.latitude,lon:c.longitude,t:pos.timestamp};lastFixAt=Date.now();if(acc>MAX_ACC){setStatus('สัญญาณ GPS ยังไม่นิ่ง · ±'+Math.round(acc)+' m');return;}
let step=lastPos?haversine(lastPos,now):0,dt=lastPos?(now.t-lastPos.t)/1000:0,v=null;
if(c.speed!=null&&Number.isFinite(c.speed)&&c.speed>=0)v=c.speed*3.6;
else if(lastPos&&dt>0)v=step/dt*3.6;
if(v==null)v=0;if(v>400||(lastPos&&dt>0&&step/dt*3.6>350))return;
if(v<MIN_KMH){speedNow=0;lastPos=now;}
else{speedNow=speedNow>0?speedNow*.3+v*.7:v;if(lastPos&&dt>0&&step>=Math.max(2,Math.min(acc,20)*.3)&&step<250&&step/dt*3.6<350)distanceM+=step;lastPos=now;if(acc<=30&&speedNow>maxSpeed)maxSpeed=speedNow;}
setStatus('GPS เชื่อมต่อแล้ว · ±'+Math.round(acc)+' m',true);render();}
function onErr(err){const msg=err.code===1?'ไม่ได้รับอนุญาตให้ใช้ GPS':err.code===2?'ไม่พบสัญญาณ GPS':'หมดเวลารอสัญญาณ GPS';setStatus(msg+' · ตรวจสอบ Location');if(err.code===1)pause();}
function stopWatch(){if(watching!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watching);watching=null;}}
function startWatch(){stopWatch();lastPos=null;watching=navigator.geolocation.watchPosition(onFix,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});}
function start(){if(running)return;if(!navigator.geolocation){setStatus('เบราว์เซอร์นี้ไม่รองรับ GPS');return;}if(!window.isSecureContext){setStatus('ต้องเปิดผ่าน HTTPS (GitHub Pages)');return;}running=true;startedAt=Date.now();lastFixAt=0;speedNow=0;$('start').textContent='Ⅱ  หยุดชั่วคราว';setStatus('กำลังค้นหาสัญญาณ GPS…',true);lockScreen();startWatch();clearInterval(tick);tick=setInterval(render,500);}
function pause(){if(!running)return;elapsedBefore+=(Date.now()-startedAt)/1000;running=false;speedNow=0;lastPos=null;stopWatch();clearInterval(tick);tick=null;unlockScreen();$('start').textContent='▶  เริ่มต่อ';setStatus('หยุดชั่วคราว');render();}
function reset(){if((distanceM>50||elapsedBefore>60)&&!confirm('รีเซ็ตข้อมูลการเดินทางทั้งหมด?'))return;pause();elapsedBefore=0;distanceM=0;maxSpeed=0;speedNow=0;lastPos=null;$('start').textContent='▶  เริ่มวัดความเร็ว';setStatus('พร้อมเริ่มวัดความเร็ว');render();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running){lockScreen();startWatch();lastFixAt=0;setStatus('กำลังค้นหาสัญญาณ GPS…',true);}});
$('start').addEventListener('click',()=>running?pause():start());$('reset').addEventListener('click',reset);
updateClock();setInterval(updateClock,1000);render();
window.addEventListener('pagehide',()=>{stopWatch();unlockScreen();});
})();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(err=>console.error('Service worker registration failed',err)));}
</script>
</body></html>
